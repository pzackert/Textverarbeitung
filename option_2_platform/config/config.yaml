# IFB PROFI - Option 1 (Super-Lite) Configuration
# Minimal RAG system with LM Studio + Qwen 4B

# Ollama Settings (Direct GGUF Loading)
llm:
  provider: "lm_studio"
  base_url: "http://127.0.0.1:1234"
  models_dir: "~/.ollama/models"
  model: "ministral-3b-lmshare:latest"
  temperature: 0.7
  max_tokens: 2000
  timeout: 120

# RAG Settings
rag:
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  top_k: 5
  similarity_threshold: 0.7
  persist_directory: "data/chromadb"
  vector_store_path: "data/chromadb"
  collection_name: "ifb_documents"

  # LLM Settings
  llm_provider: "lm_studio"
  llm_model: "ministral-3b-lmshare:latest"
  llm_base_url: "http://127.0.0.1:1234"
  llm_temperature: 0.7
  llm_max_tokens: 2000

  # Prompt Settings
  default_template: "standard"
  include_scores: false
  max_context_chunks: 5

# Document Parsing
parsing:
  pdf:
    engine: "pymupdf"
  docx:
    engine: "python-docx"
  xlsx:
    engine: "openpyxl"
  
  # Erlaubte Dateitypen
  allowed_extensions:
    - "pdf"
    - "docx"
    - "xlsx"
  
  # Max. Dateigröße in MB
  max_file_size_mb: 50

# Data Storage
storage:
  base_path: "data"
  projects_path: "data/projects"
  input_path: "data/input"
  regelwerk_path: "data/regelwerke"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/ifb_profi.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Streamlit UI
ui:
  page_title: "IFB PROFI - Antragsprüfung"
  page_icon: "📋"
  layout: "wide"

# Criteria Engine
criteria:
  required:
    - "antragssteller"
    - "foerderkonformitaet"
    - "foerdersumme"
    - "projektlaufzeit"
    - "projektkosten"
    - "rechtsform"

# Startup Configuration
startup:
  auto_load_rag: true
  timeout_per_step_sec: 90
  fallback_to_ollama: true
