[run]
repetitions = 3
warmup = true

[hyperparameters]
temperature = [0.0, 0.7]
# Expanded context length sweep for large-document RAG benchmarks.
context_length = [2048, 4096, 8192, 16384, 32768, 65536]

[[models]]
name = "openai/gpt-oss-20b"
backend = "lmstudio"
enabled = true

[[models]]
name = "mistralai/ministral-3-3b"
backend = "lmstudio"
enabled = true

[[models]]
name = "mistralai/ministral-3-14b-reasoning"
backend = "lmstudio"
enabled = false

[[models]]
name = "jinx-gpt-oss-20b"
backend = "lmstudio"
enabled = false

[[models]]
name = "qwen/qwen3-vl-4b"
backend = "lmstudio"
enabled = false

