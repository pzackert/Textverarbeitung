{% extends "base.html" %}

{% block title %}Dashboard - IFB PROFI{% endblock %}

{% block content %}
<div x-data="systemDashboard()" x-init="initDashboard()" class="relative min-h-[calc(100vh-6rem)]">

    <!-- Loading Overlay -->
    <div x-show="!systemReady"
        class="absolute inset-0 z-50 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="mb-8 relative">
            <!-- Spinner -->
            <div class="w-16 h-16 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">System wird gestartet...</h2>
        <p class="text-gray-500 mb-8" x-text="loadingStatusText"></p>

        <!-- Startup Progress Bar -->
        <div class="w-full max-w-md bg-gray-100 rounded-full h-2.5 overflow-hidden">
            <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500"
                :style="`width: ${globalProgress}%`"></div>
        </div>

        <!-- Detailed Component Status List (for transparency) -->
        <div class="mt-8 grid grid-cols-2 gap-4 text-sm w-full max-w-2xl">
            <template x-for="(comp, key) in components" :key="key">
                <div class="flex items-center justify-between p-3 rounded-lg border"
                    :class="getComponentBorder(comp.status)">
                    <span class="font-medium text-gray-700 capitalize" x-text="formatName(key)"></span>
                    <span class="text-xs font-mono" :class="getStatusColor(comp.status)" x-text="comp.status"></span>
                </div>
            </template>
        </div>

        <!-- Error Actions -->
        <div x-show="globalStatus === 'error'" class="mt-8 text-center" x-cloak>
            <p class="text-red-600 font-medium mb-4">Ein Fehler ist aufgetreten.</p>
            <button @click="triggerStartup()"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Wiederholen</button>
        </div>
    </div>

    <!-- Main Dashboard Application (Visible when Ready) -->
    <div class="px-4 py-8 opacity-0 transition-opacity duration-500" :class="{'opacity-100': systemReady}">

        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
            <span
                class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                System Gereit
            </span>
        </div>

        <!-- Status Grid (Monitoring) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <template x-for="(comp, key) in components" :key="key">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg" :class="getIconBg(key)">
                                <!-- Placeholder Icons -->
                                <span class="text-lg" x-text="getIcon(key)"></span>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-900 capitalize" x-text="formatName(key)"></h3>
                                <p class="text-xs text-gray-500" x-text="comp.message || 'Bereit'"></p>
                            </div>
                        </div>
                        <div class="w-12 text-right">
                            <div class="radial-progress text-blue-600 text-xs font-bold"
                                :style="`--value:${comp.progress || 0}; --size:2rem;`" x-text="`${comp.progress}%`">
                            </div>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="h-1.5 rounded-full transition-all duration-500" :class="getStatusBg(comp.status)"
                            :style="`width: ${comp.progress || 0}%`"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Mode Selection (Placeholders for Phase 2) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
            <h3 class="text-lg font-medium text-gray-900 mb-2">Sachbearbeiter Ansicht</h3>
            <p class="text-gray-500 mb-6">Wählen Sie einen Bereich um fortzufahren.</p>
            <div class="flex justify-center gap-4">
                <a href="/projects"
                    class="px-6 py-3 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg font-medium transition-colors">
                    Anträge verwalten
                </a>
                <a href="/chat"
                    class="px-6 py-3 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-lg font-medium transition-colors">
                    Globaler Chat
                </a>
            </div>
        </div>

    </div>
</div>

<script>
    function systemDashboard() {
        return {
            systemReady: false, // Start false, but we check fast
            globalStatus: 'initializing',
            globalProgress: 0,
            loadingStatusText: 'Status wird geprüft...',
            components: {},
            pollInterval: null,
            startTime: null,
            timeoutSecs: 30,

            async initDashboard() {
                this.startTime = Date.now();

                // 1. Immediate Status Check (Fast Path)
                const isReady = await this.checkQuickStatus();
                if (isReady) {
                    this.systemReady = true;
                    return; // Skip trigger loop if already ready
                }

                // 2. If not ready, trigger startup and start polling
                this.loadingStatusText = 'System wird gestartet...';
                this.triggerStartup();
                this.pollInterval = setInterval(() => this.pollStatus(), 1000); // Faster polling (1s)
            },

            async checkQuickStatus() {
                try {
                    const res = await fetch('/api/system/status');
                    if (res.ok) {
                        const data = await res.json();
                        this.updateState(data);
                        return data.status === 'ready';
                    }
                } catch (e) { return false; }
                return false;
            },

            async triggerStartup() {
                try { await fetch('/api/system/startup', { method: 'POST' }); }
                catch (e) { console.error("Startup trigger failed", e); }
            },

            async pollStatus() {
                try {
                    const res = await fetch('/api/system/status');
                    const data = await res.json();
                    this.updateState(data);

                    // Timeout Check
                    if (!this.systemReady && (Date.now() - this.startTime) > (this.timeoutSecs * 1000)) {
                        this.globalStatus = 'error';
                        this.loadingStatusText = 'Zeitüberschreitung beim Starten (Timeout).';
                        clearInterval(this.pollInterval);
                    }
                } catch (e) {
                    console.error("Polling connection failed", e);
                }
            },

            updateState(data) {
                this.globalStatus = data.status;
                this.components = data.components;

                const values = Object.values(this.components || {});
                if (values.length > 0) {
                    const total = values.reduce((acc, curr) => acc + (curr.progress || 0), 0);
                    this.globalProgress = Math.round(total / values.length);
                }

                if (this.globalStatus === 'ready') {
                    this.systemReady = true;
                    if (this.pollInterval) clearInterval(this.pollInterval);
                } else if (this.globalStatus === 'error') {
                    this.loadingStatusText = 'Fehler beim Starten.';
                    if (this.pollInterval) clearInterval(this.pollInterval);
                } else {
                    const activeComp = values.find(c => c.status === 'loading' || c.status === 'connecting');
                    this.loadingStatusText = activeComp ? activeComp.message : 'Initialisiere...';
                }
            },

            formatName(key) {
                const map = {
                    'ollama': 'AI Engine (Ollama)',
                    'chromadb': 'Vektor DB',
                    'rag_pipeline': 'RAG Pipeline',
                    'llm_model': 'LLM Modell',
                    'embedding_model': 'Embedding Modell',
                    'lm_studio': 'LM Studio'
                };
                return map[key] || key;
            },

            getIcon(key) {
                const icons = {
                    'ollama': '🦙', 'chromadb': '💾', 'rag_pipeline': '⚙️',
                    'llm_model': '🧠', 'embedding_model': '🔢', 'lm_studio': '🖥️'
                };
                return icons[key] || '📦';
            },

            getIconBg(key) { return 'bg-blue-50 text-blue-600'; },

            getStatusColor(status) {
                if (status === 'ready') return 'text-green-600';
                if (status === 'error') return 'text-red-600';
                return 'text-orange-600';
            },

            getStatusBg(status) {
                if (status === 'ready') return 'bg-green-500';
                if (status === 'error') return 'bg-red-500';
                return 'bg-blue-500';
            },

            getComponentBorder(status) {
                if (status === 'ready') return 'border-green-100 bg-green-50';
                if (status === 'error') return 'border-red-100 bg-red-50';
                return 'border-gray-100 bg-gray-50';
            }
        }
    }
</script>
{% endblock %}
