{% extends "base.html" %}

{% block title %}Dashboard - IFB PROFI{% endblock %}

{% block content %}
<div x-data="systemDashboard()" x-init="initDashboard()" class="relative min-h-[calc(100vh-6rem)]">

    <!-- Main Dashboard Application (Always Visible) -->
    <div class="px-4 py-8">

        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
            <span
                class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                System Bereit
            </span>
        </div>

        <!-- Status Grid (Monitoring) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <template x-for="(comp, key) in components" :key="key">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg" :class="getIconBg(key)">
                                <!-- Placeholder Icons -->
                                <span class="text-lg" x-text="getIcon(key)"></span>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-900 capitalize" x-text="formatName(key)"></h3>
                                <p class="text-xs text-gray-500" x-text="comp.message || 'Bereit'"></p>
                            </div>
                        </div>
                        <div class="w-12 text-right">
                            <div class="radial-progress text-blue-600 text-xs font-bold"
                                :style="`--value:${comp.progress || 0}; --size:2rem;`" x-text="`${comp.progress}%`">
                            </div>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="h-1.5 rounded-full transition-all duration-500" :class="getStatusBg(comp.status)"
                            :style="`width: ${comp.progress || 0}%`"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Mode Selection -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
            <h3 class="text-lg font-medium text-gray-900 mb-2">Sachbearbeiter Ansicht</h3>
            <p class="text-gray-500 mb-6">Wählen Sie einen Bereich um fortzufahren.</p>
            <div class="flex justify-center gap-4">
                <a href="/projects"
                    class="px-6 py-3 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg font-medium transition-colors">
                    Anträge verwalten
                </a>
                <a href="/chat"
                    class="px-6 py-3 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-lg font-medium transition-colors">
                    Globaler Chat
                </a>
            </div>
        </div>

    </div>
</div>

<script>
    function systemDashboard() {
        return {
            components: {},
            pollInterval: null,

            async initDashboard() {
                // Initial fetch
                await this.pollStatus();
                // Check status periodically for updates (monitoring)
                this.pollInterval = setInterval(() => this.pollStatus(), 5000);
            },

            async pollStatus() {
                try {
                    const res = await fetch('/api/system/status');
                    if (res.ok) {
                        const data = await res.json();
                        // Backend returns list now, but UI expects dict-like access?
                        // Actually SystemStateManager now returns "components" as list, AND "components_dict"
                        // I added "components_dict" to the state manager for this reason!
                        this.components = data.components_dict || {};
                    }
                } catch (e) {
                    console.error("Monitoring failed", e);
                }
            },

            formatName(key) {
                const map = {
                    'ollama': 'AI Engine (Ollama)',
                    'chromadb': 'Vektor DB',
                    'rag': 'RAG Pipeline',
                    'llm_model': 'LLM Modell',
                    'embedding_model': 'Embedding Modell',
                    'lm_studio': 'LM Studio'
                };
                return map[key] || key;
            },

            getIcon(key) {
                const icons = {
                    'ollama': '🦙', 'chromadb': '💾', 'rag': '⚙️',
                    'llm_model': '🧠', 'embedding_model': '🔢', 'lm_studio': '🖥️'
                };
                return icons[key] || '📦';
            },

            getIconBg(key) { return 'bg-blue-50 text-blue-600'; },

            getStatusBg(status) {
                if (status === 'ready') return 'bg-green-500';
                if (status === 'error') return 'bg-red-500';
                return 'bg-blue-500';
            }
        }
    }
</script>
{% endblock %}
