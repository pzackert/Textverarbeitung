<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFB PROFI - System Start</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/startup.css">
</head>

<body>

    <div class="startup-header">
        <h1>IFB PROFI wird gestartet...</h1>
        <p>Initialisiere Systemkomponenten</p>
        <button id="restart-button" style="display:none;" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-md text-sm">Erneut versuchen</button>
    </div>

    <div class="scene">
        <div class="carousel">

            <!-- 1. Model Scanner -->
            <div class="card" id="card-model_scanner">
                <div class="card-icon">🔎</div>
                <div class="card-content">
                    <div class="card-title">Model Scanner</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

            <!-- 2. AI Provider -->
            <div class="card" id="card-ai_provider">
                <div class="card-icon">🤖</div>
                <div class="card-content">
                    <div class="card-title">AI Provider Check</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

            <!-- 3. Vector Store -->
            <div class="card" id="card-vector_store">
                <div class="card-icon">💾</div>
                <div class="card-content">
                    <div class="card-title">Vector Store</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

            <!-- 4. LLM Loading -->
            <div class="card" id="card-llm_loading">
                <div class="card-icon">🧠</div>
                <div class="card-content">
                    <div class="card-title">LLM Model Loading</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

            <!-- 5. Global Knowledge -->
            <div class="card" id="card-global_knowledge">
                <div class="card-icon">📚</div>
                <div class="card-content">
                    <div class="card-title">Global Knowledge</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

            <!-- 6. Project Healing -->
            <div class="card" id="card-project_healing">
                <div class="card-icon">📁</div>
                <div class="card-content">
                    <div class="card-title">Project Healing</div>
                    <div class="card-status">
                        <span class="status-text">Wartet...</span>
                        <span class="timestamp"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </div>
                <div class="status-indicator pending"></div>
            </div>

        </div>
    </div>

    <script src="/static/js/startup.js"></script>
</body>

</html>
