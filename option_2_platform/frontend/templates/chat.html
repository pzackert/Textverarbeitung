{% extends "base.html" %}

{% block content %}
<div class="flex h-[calc(100vh-6rem)] -mt-4 bg-white border rounded-lg shadow-sm overflow-hidden" x-data="globalChat()"
    x-init="initChat()">

    <!-- Sidebar: Chat History -->
    <div class="w-1/4 border-r bg-gray-50 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-white">
            <h2 class="font-semibold text-gray-700">Globale Chats</h2>
            <button @click="createChat()" class="text-blue-600 hover:bg-blue-50 p-1 rounded transition-colors"
                title="Neuer Chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-2">
            <template x-for="chat in chatList" :key="chat.chat_id">
                <div @click="loadChat(chat.chat_id)"
                    class="p-3 rounded-lg cursor-pointer transition-colors group relative"
                    :class="activeChatId === chat.chat_id ? 'bg-white shadow border border-blue-100' : 'hover:bg-gray-100'">
                    <h3 class="font-medium text-sm text-gray-900 truncate" x-text="chat.title"></h3>
                    <p class="text-xs text-gray-500 truncate mt-1" x-text="chat.last_message"></p>

                    <!-- Delete Button (Hover) -->
                    <button @click.stop="deleteChat(chat.chat_id)"
                        class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="w-3/4 flex flex-col bg-white">

        <!-- Header (Active Chat Info) -->
        <div class="h-14 border-b flex items-center px-6 justify-between bg-white" x-show="activeChatId">
            <span class="font-semibold text-gray-800" x-text="activeChatTitle"></span>
            <span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded">Globaler Modus (Kein
                Projekt-Kontext)</span>
        </div>

        <!-- Empty State -->
        <div x-show="!activeChatId" class="flex-1 flex items-center justify-center flex-col text-gray-400">
            <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                </path>
            </svg>
            <p>Wählen Sie einen Chat aus oder erstellen Sie einen neuen.</p>
        </div>

        <!-- Messages Area -->
        <div x-show="activeChatId" class="flex-1 overflow-y-auto p-6 space-y-6" id="chat-scroller">
            <template x-for="msg in messages" :key="msg.timestamp">
                <div class="flex flex-col" :class="msg.role === 'user' ? 'items-end' : 'items-start'">
                    <div class="max-w-[80%] rounded-2xl px-5 py-3 shadow-sm"
                        :class="msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'">
                        <p class="whitespace-pre-wrap leading-relaxed" x-text="msg.content"></p>

                        <!-- Sources (Use Case A3) -->
                        <template x-if="msg.sources && msg.sources.length > 0">
                            <div class="mt-2 pt-2 border-t border-gray-200/50">
                                <p class="text-xs font-semibold mb-1 opacity-70">Quellen:</p>
                                <div class="flex flex-wrap gap-1">
                                    <template x-for="source in msg.sources">
                                        <a href="#"
                                            class="text-xs bg-white/50 px-2 py-1 rounded border border-gray-200 hover:bg-white hover:shadow-sm transition-all"
                                            :title="source.document || 'Quelle'">
                                            <span
                                                x-text="(source.document || 'Dokument') + (source.page ? ' (S. ' + source.page + ')' : '')"></span>
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Metrics (Use Case A3) -->
                        <template x-if="msg.metrics">
                            <div class="mt-1 pt-1 border-t border-white/10 opacity-60 text-[10px] font-mono flex gap-2">
                                <span x-text="msg.metrics.tokens_per_second + ' tok/s'"></span>
                                <span>•</span>
                                <span x-text="msg.metrics.total_tokens + ' tokens'"></span>
                                <span>•</span>
                                <span x-text="msg.metrics.time_to_first_token_sec + 's TTFT'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <div x-show="isTyping" class="flex items-start">
                <div class="bg-gray-100 rounded-2xl rounded-bl-none px-4 py-3">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-75"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-150"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div x-show="activeChatId" class="p-4 border-t bg-white">
            <div class="relative">
                <textarea x-model="userInput" @keydown.enter.prevent="sendMessage()"
                    class="w-full border-gray-300 rounded-lg pr-12 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
                    rows="3" placeholder="Nachricht schreiben..."></textarea>
                <button @click="sendMessage()" :disabled="!userInput.trim() || isTyping"
                    class="absolute right-2 bottom-2 p-2 text-blue-600 hover:bg-blue-50 rounded-full transition-colors disabled:opacity-50">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    function globalChat() {
        return {
            chatList: [],
            activeChatId: null,
            activeChatTitle: '',
            messages: [],
            userInput: '',
            isTyping: false,

            async initChat() {
                await this.refreshList();
                if (this.chatList.length === 0) {
                    await this.createChat();
                }
            },

            async refreshList() {
                try {
                    const res = await fetch('/api/chats/global');
                    if (!res.ok) throw new Error("Failed to load chats");
                    const data = await res.json();
                    this.chatList = data.chats || [];
                } catch (e) {
                    console.error("Error loading chat list:", e);
                }
            },

            async createChat() {
                try {
                    const res = await fetch('/api/chats/global/create', { method: 'POST' });
                    if (!res.ok) throw new Error("Failed to create chat");
                    const chat = await res.json();
                    await this.refreshList();
                    this.loadChat(chat.chat_id);
                } catch (e) {
                    console.error("Error creating chat:", e);
                }
            },

            async deleteChat(chatId) {
                if (!confirm("Chat löschen?")) return;
                await fetch(`/api/chats/global/${chatId}`, { method: 'DELETE' });
                if (this.activeChatId === chatId) {
                    this.activeChatId = null;
                    this.messages = [];
                }
                await this.refreshList();
            },

            async loadChat(chatId) {
                this.activeChatId = chatId;
                const chat = this.chatList.find(c => c.chat_id === chatId);
                // Use nice formatting or fallback
                this.activeChatTitle = chat ? (chat.created_at || chatId) : 'Chat';

                try {
                    const res = await fetch(`/api/chats/global/${chatId}`);
                    if (!res.ok) throw new Error("Failed to load chat history");
                    const data = await res.json();
                    this.messages = data.messages || [];
                    this.scrollToBottom();
                } catch (e) {
                    console.error("Error loading chat:", e);
                }
            },

            async sendMessage() {
                if (!this.userInput.trim() || this.isTyping) return;

                const text = this.userInput;
                this.userInput = '';

                this.messages.push({ role: 'user', content: text, timestamp: new Date().toISOString() });
                this.scrollToBottom();
                this.isTyping = true;

                try {
                    const res = await fetch(`/api/chats/global/${this.activeChatId}/message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: text,
                            include_rag: true
                        })
                    });

                    if (!res.ok) throw new Error("Message failed");

                    const data = await res.json();
                    this.messages.push(data.assistant_message);
                    await this.refreshList();
                } catch (e) {
                    console.error("Msg failed", e);
                    this.messages.push({
                        role: 'assistant',
                        content: "Fehler beim Senden der Nachricht: " + e.message,
                        timestamp: new Date().toISOString()
                    });
                } finally {
                    this.isTyping = false;
                    this.scrollToBottom();
                }
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const container = document.getElementById('chat-scroller');
                    if (container) container.scrollTop = container.scrollHeight;
                });
            }
        }
    }
</script>
{% endblock %}
